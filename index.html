<style>
  :root{
    --floor:#15171B; --slab:#1E2127; --slab-2:#262A31; --line:#333842;
    --chalk:#EFEDE6; --steel:#8D94A0; --plate:#3E7BFA; --hot:#E8563F; --good:#4FB477; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--floor);color:var(--chalk);
    font-family:'Barlow',system-ui,sans-serif;font-size:17px;overscroll-behavior-y:contain}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font-family:inherit}
  .num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:-.02em}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px calc(48px + env(safe-area-inset-bottom))}

  .bar{position:sticky;top:0;z-index:40;background:rgba(21,23,27,.94);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .who{display:flex;background:var(--slab);border-radius:999px;padding:3px;gap:2px}
  .who button{padding:7px 15px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--steel)}
  .who button[aria-pressed="true"]{background:var(--plate);color:#fff}
  .spacer{flex:1}
  .bar-note{font-size:.78rem;color:var(--steel);letter-spacing:.06em;text-transform:uppercase}
  .pill{background:var(--slab-2);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.85rem}

  .eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--steel);margin:24px 0 8px}
  .card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r)}

  .next{padding:20px;position:relative;overflow:hidden}
  .next::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:50%;background:var(--plate);opacity:.10}
  .next h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:2.5rem;
    line-height:1;text-transform:uppercase}
  .next p{margin:8px 0 0;color:var(--steel);font-size:.9rem}
  .primary{width:100%;background:var(--plate);color:#fff;padding:17px;border-radius:12px;
    font-weight:600;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px}
  .primary:active{transform:scale(.985)}
  .start{margin-top:18px}

  .today{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tile{background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center}

  .week{padding:16px}

  .dots{display:flex;gap:4px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--slab-2);border:1px solid var(--line)}
  .dot.f{background:var(--plate);border-color:var(--plate)}
  .trend{font-size:.8rem;color:var(--steel);margin-top:12px;line-height:1.45}
  .trend b{color:var(--chalk);font-weight:500}

  .daylist{display:grid;gap:8px}
  .dayrow{display:flex;align-items:center;gap:12px;background:var(--slab);border:1px solid var(--line);
    border-radius:12px;padding:13px 15px;width:100%;text-align:left}
  .dayrow .idx{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--plate);min-width:20px}
  .dayrow .nm{flex:1;font-weight:500;font-size:.95rem}
  .dayrow .mt{color:var(--steel);font-size:.78rem}

  .ex{background:var(--slab);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:13px 14px}
  .ex.done{border-color:var(--good);background:#1A2320}
  .ex-top{display:flex;align-items:center;gap:12px}
  .ex-name{flex:1;min-width:0}
  .ex-name b{display:block;font-weight:600;font-size:.98rem;line-height:1.25}
  .ex-name span{display:block;color:var(--steel);font-size:.78rem;margin-top:2px}
  .check{width:46px;height:46px;border-radius:12px;background:var(--slab-2);border:1px solid var(--line);
    flex:none;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--steel)}
  .check.on{background:var(--good);border-color:var(--good);color:#0d1a12}
  .setline{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap}
  .grp{display:flex;align-items:center;gap:4px;background:#191C21;border:1px solid var(--line);
    border-radius:10px;padding:4px}
  .grp button{width:38px;height:38px;border-radius:8px;background:var(--slab-2);font-size:1.3rem;
    display:flex;align-items:center;justify-content:center}
  .grp button:active{background:var(--plate)}
  .grp input{width:54px;background:none;border:0;text-align:center;color:var(--chalk);
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.45rem;padding:0}
  .grp input:focus{outline:none;color:var(--plate)}
  .u{font-size:.7rem;color:var(--steel);letter-spacing:.1em;text-transform:uppercase}
  .prevline{margin-top:9px;color:var(--steel)}
  .prevline b{color:var(--chalk);font-weight:500}

  .knee{margin-top:11px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .knee button{background:var(--slab-2);border:1px solid var(--line);border-radius:9px;padding:9px 3px;
    font-size:.68rem;line-height:1.25;color:var(--steel)}
  .knee button[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:#fff}
  .knee button[aria-pressed="true"].warn{background:var(--hot);border-color:var(--hot)}
  .kneemsg{margin-top:8px;font-size:.8rem;color:#F0C4B8;line-height:1.4}

  .veil{position:fixed;inset:0;background:rgba(10,11,13,.7);z-index:70;opacity:0;pointer-events:none;
    transition:opacity .2s}
  .veil.up{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--slab);
    border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:20px 16px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .24s ease;max-width:560px;margin:0 auto}
  .sheet.up{transform:translateY(0)}
  .sheet h2{margin:0 0 16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.6rem;
    text-transform:uppercase}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .opts button{background:var(--slab-2);border:1px solid var(--line);border-radius:11px;padding:14px 8px;
    font-size:.88rem;font-weight:500}
  .opts button[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:#fff}
  .bigdial{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
  .bigdial button{width:56px;height:56px;border-radius:14px;background:var(--slab-2);font-size:1.7rem;
    display:flex;align-items:center;justify-content:center}
  .bigdial input{width:130px;background:none;border:0;text-align:center;color:var(--chalk);
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:2.9rem;padding:0}
  .bigdial input:focus{outline:none;color:var(--plate)}
  .unit{text-align:center;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--steel);
    margin:0 0 18px}
  .ghostbtn{width:100%;background:var(--slab-2);border-radius:12px;padding:14px;font-weight:600;margin-top:8px}

  .rest{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--slab);border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;
    transform:translateY(110%);transition:transform .22s ease;max-width:560px;margin:0 auto}
  .rest.up{transform:translateY(0)}
  .rest .t{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:2rem;min-width:72px}
  .rest .t.zero{color:var(--good)}
  .rest .meta{flex:1;font-size:.8rem;color:var(--steel)}
  .rest .skip{background:var(--slab-2);padding:10px 15px;border-radius:999px;font-size:.84rem;font-weight:600}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(12px);
    background:var(--slab-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;
    font-size:.85rem;opacity:0;pointer-events:none;transition:all .2s;z-index:90}
  .toast.up{opacity:1;transform:translateX(-50%) translateY(0)}
  .warnbox{background:#2A1B18;border:1px solid #573028;border-radius:12px;padding:12px 14px;
    font-size:.84rem;line-height:1.45;color:#F0C4B8}
  .summary{padding:22px;text-align:center}
  .summary .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:3rem;line-height:1;color:var(--plate)}
  .modeline{display:flex;align-items:center;gap:8px;margin:16px 0 10px;font-size:.8rem;color:var(--steel)}
  .modeline button{background:var(--slab-2);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:.78rem;color:var(--chalk);flex:none}

  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;
    align-items:center;font-size:.76rem;color:var(--steel)}
  .foot button{background:var(--slab-2);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:.76rem;color:var(--chalk)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<div class="wrap" id="app"></div>
<div class="rest" id="rest"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>

/* ---- storage: Claude artifact storage if present, else localStorage ---- */
const LS={
  async get(k){const v=localStorage.getItem(k);if(v===null)throw new Error("missing");return{key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v);return{key:k,value:v};}
};
const DB=(typeof window!=="undefined"&&window.storage&&window.storage.get)?window.storage:LS;

const R={heavy:150,mid:120,iso:75};
const PROGRAMS={
  ben:{name:"Ben",cardioGoal:3,stepGoal:11000,
    types:["Incline walk","Bike","Elliptical","Stairs","Sled / HIIT","Other"],
    days:[
      {name:"Push",ex:[
        {n:"Barbell bench press",s:4,r:"5–8",w:185,rep:6,st:5,rest:R.heavy},
        {n:"Incline DB press",s:3,r:"8–10",w:60,rep:9,st:5,rest:R.mid},
        {n:"Cable lateral raise",s:4,r:"12–20",w:15,rep:14,st:2.5,rest:R.iso},
        {n:"Overhead cable triceps ext",s:3,r:"10–12",w:40,rep:11,st:5,rest:R.iso},
        {n:"Triceps pushdown",s:2,r:"12–15",w:50,rep:13,st:5,rest:R.iso}]},
      {name:"Pull",ex:[
        {n:"Weighted pull-up / pulldown",s:4,r:"6–10",w:25,rep:8,st:5,rest:R.heavy},
        {n:"Chest-supported row",s:4,r:"8–10",w:90,rep:9,st:5,rest:R.mid},
        {n:"Seated cable row",s:3,r:"10–12",w:130,rep:11,st:5,rest:R.mid},
        {n:"Rear delt flye",s:3,r:"15–20",w:15,rep:16,st:2.5,rest:R.iso},
        {n:"Face pull",s:2,r:"15–20",w:40,rep:16,st:5,rest:R.iso},
        {n:"Incline DB curl",s:3,r:"8–12",w:25,rep:10,st:5,rest:R.iso},
        {n:"Hammer curl",s:2,r:"10–12",w:30,rep:11,st:5,rest:R.iso}]},
      {name:"Legs — quad",ex:[
        {n:"Back squat",s:4,r:"5–8",w:225,rep:6,st:10,rest:R.heavy},
        {n:"Leg press / hack squat",s:3,r:"8–12",w:270,rep:10,st:10,rest:R.mid},
        {n:"Seated leg curl",s:3,r:"8–12",w:100,rep:10,st:5,rest:R.mid},
        {n:"Leg extension",s:2,r:"12–15",w:110,rep:13,st:5,rest:R.iso},
        {n:"Standing calf raise",s:4,r:"8–12",w:150,rep:10,st:10,rest:R.iso}]},
      {name:"Upper",ex:[
        {n:"Incline barbell press",s:4,r:"8–10",w:135,rep:9,st:5,rest:R.heavy},
        {n:"Cable fly",s:3,r:"12–15",w:30,rep:13,st:5,rest:R.iso},
        {n:"Lat pulldown",s:3,r:"10–12",w:140,rep:11,st:5,rest:R.mid},
        {n:"Lateral raise",s:4,r:"12–20",w:15,rep:15,st:2.5,rest:R.iso},
        {n:"Rear delt flye",s:3,r:"15–20",w:15,rep:17,st:2.5,rest:R.iso},
        {n:"Curl (superset)",s:2,r:"10–15",w:30,rep:12,st:5,rest:R.iso},
        {n:"Pushdown (superset)",s:2,r:"10–15",w:50,rep:12,st:5,rest:R.iso}]},
      {name:"Legs — hinge + abs",ex:[
        {n:"Romanian deadlift",s:4,r:"6–10",w:185,rep:8,st:10,rest:R.heavy},
        {n:"Hack squat / Bulgarian split",s:3,r:"8–10",w:180,rep:9,st:10,rest:R.mid},
        {n:"Lying leg curl",s:3,r:"10–15",w:80,rep:12,st:5,rest:R.iso},
        {n:"Seated calf raise",s:4,r:"10–15",w:90,rep:12,st:5,rest:R.iso},
        {n:"Hanging leg raise",s:3,r:"10–15",w:0,rep:12,st:5,rest:R.iso},
        {n:"Cable crunch",s:3,r:"12–15",w:70,rep:13,st:5,rest:R.iso}]}
    ]},
  bria:{name:"Bria",cardioGoal:4,stepGoal:9000,
    types:["Incline walk","Bike","Elliptical","Swim","Walk outside","Other"],
    days:[
      {name:"Lower A — glute / hinge",ex:[
        {n:"Hip thrust",s:4,r:"8–12",w:135,rep:10,st:10,rest:R.mid,k:1},
        {n:"Romanian deadlift",s:3,r:"8–10",w:85,rep:9,st:5,rest:R.mid,k:1},
        {n:"Seated leg curl",s:3,r:"10–12",w:50,rep:11,st:5,rest:R.iso},
        {n:"Leg press — feet high, pain-free ROM",s:3,r:"10–12",w:130,rep:11,st:10,rest:R.mid,k:1},
        {n:"Hip abduction",s:3,r:"15–20",w:70,rep:17,st:5,rest:R.iso},
        {n:"Seated calf raise",s:3,r:"12–15",w:45,rep:13,st:5,rest:R.iso}]},
      {name:"Upper A — push",ex:[
        {n:"Machine or DB chest press",s:3,r:"8–10",w:30,rep:9,st:5,rest:R.mid},
        {n:"Seated DB shoulder press",s:3,r:"8–10",w:20,rep:9,st:5,rest:R.mid},
        {n:"Lat pulldown",s:3,r:"8–10",w:70,rep:9,st:5,rest:R.mid},
        {n:"Cable lateral raise",s:3,r:"12–20",w:7.5,rep:15,st:2.5,rest:R.iso},
        {n:"Rear delt flye",s:3,r:"15–20",w:10,rep:17,st:2.5,rest:R.iso},
        {n:"Triceps pushdown",s:2,r:"10–15",w:30,rep:12,st:5,rest:R.iso},
        {n:"Dead bug",s:3,r:"8–10 / side",w:0,rep:9,st:5,rest:R.iso},
        {n:"Pallof press",s:2,r:"10–12 / side",w:20,rep:11,st:5,rest:R.iso}]},
      {name:"Lower B — posterior",ex:[
        {n:"45° back extension",s:3,r:"10–15",w:0,rep:12,st:5,rest:R.mid},
        {n:"Leg press — single leg",s:3,r:"10–12",w:70,rep:11,st:10,rest:R.mid,k:1},
        {n:"Lying leg curl",s:3,r:"10–15",w:45,rep:12,st:5,rest:R.iso},
        {n:"Cable glute kickback",s:3,r:"12–15",w:25,rep:13,st:5,rest:R.iso,k:1},
        {n:"Hip abduction",s:3,r:"15–20",w:70,rep:17,st:5,rest:R.iso},
        {n:"Standing calf raise",s:3,r:"10–15",w:80,rep:12,st:10,rest:R.iso}]},
      {name:"Upper B — pull",ex:[
        {n:"Chest-supported row",s:4,r:"8–12",w:50,rep:10,st:5,rest:R.mid},
        {n:"Neutral-grip lat pulldown",s:3,r:"10–12",w:70,rep:11,st:5,rest:R.mid},
        {n:"Incline DB or machine press",s:3,r:"10–12",w:25,rep:11,st:5,rest:R.mid},
        {n:"Face pull",s:3,r:"15–20",w:30,rep:17,st:5,rest:R.iso},
        {n:"DB curl",s:3,r:"10–12",w:15,rep:11,st:2.5,rest:R.iso},
        {n:"Lateral raise",s:3,r:"12–20",w:10,rep:15,st:2.5,rest:R.iso},
        {n:"Reverse crunch",s:3,r:"12–15",w:0,rep:13,st:5,rest:R.iso},
        {n:"Side plank",s:2,r:"30–45 sec / side",w:0,rep:1,st:5,rest:R.iso}]},
      {name:"Optional — core & hips",ex:[
        {n:"Glute bridge",s:3,r:"15–20",w:0,rep:17,st:5,rest:R.iso},
        {n:"Clamshell",s:3,r:"15 / side",w:0,rep:15,st:5,rest:R.iso},
        {n:"Standing hip abduction",s:2,r:"15 / side",w:10,rep:15,st:5,rest:R.iso},
        {n:"Cable crunch",s:3,r:"12–15",w:50,rep:13,st:5,rest:R.iso},
        {n:"Plank",s:2,r:"45 sec",w:0,rep:1,st:5,rest:R.iso}]}
    ]}
};

let who="ben",view="home",store={},sess=null,done=null,detail=false;
let timer=null,restLeft=0,restTot=0,sheetState={};
const $=id=>document.getElementById(id);
const P=()=>PROGRAMS[who];
const key=p=>`liftlog.v2.${p}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fw=w=>(Math.round(w*10)/10).toString().replace(/\.0$/,'');
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
const today=()=>iso(Date.now());

async function load(p){
  try{const r=await DB.get(key(p));store[p]=JSON.parse(r.value);}
  catch(e){store[p]=null;}
  if(!store[p])store[p]={sessions:[],last:{},lastDay:-1,daily:{}};
  const d=store[p];
  d.sessions=d.sessions||[];d.last=d.last||{};d.daily=d.daily||{};
  if(d.lastDay===undefined)d.lastDay=-1;
}
async function save(p){
  try{await DB.set(key(p),JSON.stringify(store[p]));}
  catch(e){toast("Couldn't save — try again");}
}
function dayRec(dt){const d=store[who].daily;if(!d[dt])d[dt]={cardio:[],steps:null,bw:null};return d[dt];}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("up");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("up"),1700);}

function bwTrend(){
  const d=store[who].daily;
  const pts=Object.keys(d).filter(k=>d[k]&&d[k].bw).sort().map(k=>({k,v:d[k].bw}));
  if(!pts.length)return null;
  const avg=a=>a.reduce((s,x)=>s+x.v,0)/a.length;
  const recent=pts.slice(-7),older=pts.slice(-14,-7);
  const cur=avg(recent);
  if(older.length<2)return{cur,rate:null};
  const span=(new Date(recent[recent.length-1].k)-new Date(older[0].k))/864e5;
  return{cur,rate:span>0?((avg(older)-cur)/span)*7:null};
}
function weekStats(){
  const d=store[who].daily,out={lifts:0,cardio:0,steps:[],dots:[]};
  const start=new Date();start.setDate(start.getDate()-6);
  for(let i=0;i<7;i++){
    const dt=iso(new Date(start.getTime()+i*864e5)),e=d[dt];
    const lifted=store[who].sessions.some(s=>iso(s.date)===dt);
    if(lifted)out.lifts++;
    if(e&&e.cardio&&e.cardio.length)out.cardio+=e.cardio.length;
    if(e&&e.steps)out.steps.push(e.steps);
    out.dots.push(lifted);
  }
  out.avgSteps=out.steps.length?Math.round(out.steps.reduce((a,b)=>a+b,0)/out.steps.length):null;
  return out;
}

function bar(){
  const b=$("bar");
  if(view==="session"){
    b.innerHTML=`<div class="bar-note">${esc(sess.dayName)}</div><div class="spacer"></div>
      <button class="pill" id="fin">Finish</button>`;
    $("fin").onclick=finish;
  }else{
    b.innerHTML=`<div class="who">
        <button data-p="ben" aria-pressed="${who==='ben'}">Ben</button>
        <button data-p="bria" aria-pressed="${who==='bria'}">Bria</button>
      </div><div class="spacer"></div><div class="bar-note">Lift Log</div>`;
    b.querySelectorAll("[data-p]").forEach(el=>el.onclick=async()=>{
      who=el.dataset.p;if(!store[who])await load(who);render();});
  }
}

function nextIdx(){const d=store[who];return d.lastDay===-1?0:(d.lastDay+1)%P().days.length;}

function home(){
  const p=P(),ni=nextIdx(),dy=p.days[ni];
  const t=store[who].daily[today()]||{cardio:[],steps:null,bw:null};
  const w=weekStats(),tr=bwTrend();
  const cm=t.cardio.reduce((a,c)=>a+c.min,0);
  let h=`<div class="eyebrow">Today</div><div class="today">
    <button class="tile ${t.bw?'on':''}" data-sheet="bw">
      <div class="v ${t.bw?'':'dim'}">${t.bw?fw(t.bw):'—'}</div><div class="k">Weight</div></button>
    <button class="tile ${cm?'on':''}" data-sheet="cardio">
      <div class="v ${cm?'':'dim'}">${cm?cm+"m":'+'}</div><div class="k">Cardio</div></button>
    <button class="tile ${t.steps>=p.stepGoal?'on':''}" data-sheet="steps">
      <div class="v ${t.steps?'':'dim'}">${t.steps?(t.steps/1000).toFixed(1)+"k":'—'}</div><div class="k">Steps</div></button>
  </div>`;

  h+=`<div class="eyebrow">Next up</div>
    <div class="card next"><h1>${esc(dy.name)}</h1>
      <p>${dy.ex.length} exercises · ${dy.ex.reduce((a,e)=>a+e.s,0)} sets</p>
      <button class="primary start" id="go">Start</button></div>`;

  h+=`<div class="eyebrow">Last 7 days</div><div class="card week">
    <div class="wrow"><span class="l">Lifting</span>
      <span class="dots">${w.dots.map(f=>`<span class="dot ${f?'f':''}"></span>`).join("")}</span>
      <span class="v">${w.lifts}</span></div>
    <div class="wrow"><span class="l">Cardio sessions</span>
      <span class="n">goal ${p.cardioGoal}</span><span class="v">${w.cardio}</span></div>
    <div class="wrow"><span class="l">Avg steps</span>
      <span class="n">goal ${(p.stepGoal/1000).toFixed(0)}k</span>
      <span class="v">${w.avgSteps?(w.avgSteps/1000).toFixed(1)+"k":"—"}</span></div>`;
  if(tr&&tr.rate!==null){
    const rate=Math.abs(tr.rate).toFixed(1),dir=tr.rate>0?"down":"up";
    const fast=who==="ben"&&tr.rate>2;
    h+=`<div class="trend ${fast?'warn':''}">7-day average <b>${fw(tr.cur)} lb</b> · <b>${rate} lb/week ${dir}</b>.`+
      (fast?` Faster than 2 lb/wk — steep enough to start costing muscle.`:``)+`</div>`;
  }else if(tr){
    h+=`<div class="trend">7-day average <b>${fw(tr.cur)} lb</b>. Another week of weigh-ins and the rate of loss shows up here.</div>`;
  }else{
    h+=`<div class="trend">Tap Weight each morning. After two weeks this shows your real rate of loss — far more useful than any single day's number.</div>`;
  }
  h+=`</div>`;

  h+=`<div class="eyebrow">Train something else</div><div class="daylist">`;
  p.days.forEach((dd,i)=>{if(i===ni)return;
    h+=`<button class="dayrow" data-d="${i}"><span class="idx num">${i+1}</span>
      <span class="nm">${esc(dd.name)}</span><span class="mt num">${dd.ex.reduce((a,e)=>a+e.s,0)}</span></button>`;});
  h+=`</div>`;

  if(t.cardio.length){
    h+=`<div class="eyebrow">Cardio today · tap to remove</div>`;
    t.cardio.forEach((c,i)=>{h+=`<button class="dayrow" data-delc="${i}">
      <span class="nm">${esc(c.type)}</span><span class="mt num">${c.min} min</span></button>`;});
  }
  h+=`<div class="foot"><span class="spacer">Backup</span>
    <button id="expBtn">Copy data</button><button id="impBtn">Restore</button></div>`;
  $("app").innerHTML=h;
  $("go").onclick=()=>start(ni);
  wireBackup();
  document.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>start(+el.dataset.d));
  document.querySelectorAll("[data-sheet]").forEach(el=>el.onclick=()=>openSheet(el.dataset.sheet));
  document.querySelectorAll("[data-delc]").forEach(el=>el.onclick=async()=>{
    dayRec(today()).cardio.splice(+el.dataset.delc,1);await save(who);render();toast("Removed");});
}

function openSheet(kind){
  const p=P(),t=dayRec(today()),tr=bwTrend();
  sheetState={kind,type:p.types[0],min:30,steps:t.steps||p.stepGoal,bw:t.bw||(tr?Math.round(tr.cur*10)/10:180)};
  paintSheet();$("veil").classList.add("up");$("sheet").classList.add("up");
  $("veil").onclick=closeSheet;
}
function closeSheet(){$("veil").classList.remove("up");$("sheet").classList.remove("up");}
function paintSheet(){
  const s=sheetState,p=P();let h="";
  if(s.kind==="cardio"){
    h+=`<h2>Log cardio</h2><div class="opts">`;
    p.types.forEach(t=>{h+=`<button data-t="${esc(t)}" aria-pressed="${s.type===t}">${esc(t)}</button>`;});
    h+=`</div><div class="bigdial">
      <button data-adj="min" data-v="-1">−</button>
      <input inputmode="numeric" id="fmin" value="${s.min}" aria-label="Minutes">
      <button data-adj="min" data-v="1">+</button></div>
      <div class="unit">minutes · ± 5</div><button class="primary" id="saveSheet">Save</button>`;
  }else if(s.kind==="steps"){
    h+=`<h2>Steps today</h2><div class="bigdial">
      <button data-adj="steps" data-v="-1">−</button>
      <input inputmode="numeric" id="fsteps" value="${s.steps}" aria-label="Steps">
      <button data-adj="steps" data-v="1">+</button></div>
      <div class="unit">steps · ± 500 · tap the number to type it</div>
      <button class="primary" id="saveSheet">Save</button>`;
  }else{
    h+=`<h2>Bodyweight</h2><div class="bigdial">
      <button data-adj="bw" data-v="-1">−</button>
      <input inputmode="decimal" id="fbw" value="${fw(s.bw)}" aria-label="Bodyweight">
      <button data-adj="bw" data-v="1">+</button></div>
      <div class="unit">lb · ± 0.2 · same time, same conditions</div>
      <button class="primary" id="saveSheet">Save</button>`;
  }
  h+=`<button class="ghostbtn" id="cancelSheet">Cancel</button>`;
  $("sheet").innerHTML=h;
  $("sheet").querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>{s.type=el.dataset.t;paintSheet();});
  $("sheet").querySelectorAll("[data-adj]").forEach(el=>el.onclick=()=>{
    const d=+el.dataset.v;
    if(el.dataset.adj==="min")s.min=Math.max(5,s.min+d*5);
    if(el.dataset.adj==="steps")s.steps=Math.max(0,s.steps+d*500);
    if(el.dataset.adj==="bw")s.bw=Math.max(50,Math.round((s.bw+d*0.2)*10)/10);
    paintSheet();});
  ["fmin","fsteps","fbw"].forEach(id=>{const el=$(id);if(!el)return;
    el.onfocus=()=>el.select();
    el.onchange=()=>{const v=parseFloat(el.value);
      if(!isNaN(v)){
        if(id==="fmin")s.min=Math.max(1,Math.round(v));
        if(id==="fsteps")s.steps=Math.max(0,Math.round(v));
        if(id==="fbw")s.bw=v;}
      paintSheet();};});
  $("cancelSheet").onclick=closeSheet;
  $("saveSheet").onclick=async()=>{
    const t=dayRec(today());
    if(s.kind==="cardio"){t.cardio.push({type:s.type,min:s.min});toast(`${s.min} min logged`);}
    if(s.kind==="steps"){t.steps=s.steps;toast("Steps saved");}
    if(s.kind==="bw"){t.bw=s.bw;toast("Weight saved");}
    await save(who);closeSheet();render();};
}

function start(di){
  const d=P().days[di];
  sess={di,dayName:d.name,start:Date.now(),
    ex:d.ex.map(e=>{const prev=store[who].last[e.n];
      return{...e,w:prev?prev.w:e.w,rep:prev?prev.rep:e.rep,sets:prev&&prev.sets?prev.sets:e.s,
        logged:false,knee:e.k?null:undefined,prev};})};
  view="session";render();window.scrollTo(0,0);
}

function session(){
  let h=`<div class="modeline"><span>${detail?"Adjusting sets too":"Tap the check when the exercise is done"}</span>
    <div class="spacer"></div><button id="mode">${detail?"Simpler":"Edit sets"}</button></div>`;
  sess.ex.forEach((e,i)=>{
    h+=`<div class="ex ${e.logged?'done':''}">
      <div class="ex-top">
        <span class="ex-name"><b>${esc(e.n)}</b><span>${e.s} × ${esc(e.r)}</span></span>
        <button class="check ${e.logged?'on':''}" data-tick="${i}" aria-label="Mark done">${e.logged?'✓':''}</button>
      </div>`;
    if(e.prev)h+=`<div class="prevline mono">LAST · <b>${fw(e.prev.w)} × ${e.prev.rep}</b> × ${e.prev.sets} sets</div>`;
    h+=`<div class="setline">
      <div class="grp"><button data-a="w" data-i="${i}" data-v="-1">−</button>
        <input inputmode="decimal" value="${fw(e.w)}" data-f="w" data-i="${i}" aria-label="Weight">
        <button data-a="w" data-i="${i}" data-v="1">+</button></div><span class="u">lb</span>
      <div class="grp"><button data-a="r" data-i="${i}" data-v="-1">−</button>
        <input inputmode="numeric" value="${e.rep}" data-f="r" data-i="${i}" aria-label="Reps">
        <button data-a="r" data-i="${i}" data-v="1">+</button></div><span class="u">reps</span>`;
    if(detail)h+=`<div class="grp"><button data-a="s" data-i="${i}" data-v="-1">−</button>
        <input inputmode="numeric" value="${e.sets}" data-f="s" data-i="${i}" aria-label="Sets">
        <button data-a="s" data-i="${i}" data-v="1">+</button></div><span class="u">sets</span>`;
    h+=`</div>`;
    if(e.knee!==undefined){
      h+=`<div class="knee">
        <button data-k="${i}-0" aria-pressed="${e.knee===0}">0<br>Fine</button>
        <button data-k="${i}-1" aria-pressed="${e.knee===1}">1<br>Ache</button>
        <button data-k="${i}-2" class="warn" aria-pressed="${e.knee===2}">2<br>Pain</button>
        <button data-k="${i}-3" class="warn" aria-pressed="${e.knee===3}">3<br>Shifting</button></div>`;
      if(e.knee===2)h+=`<div class="kneemsg">Drop this movement today. Note it for the PT.</div>`;
      if(e.knee===3)h+=`<div class="kneemsg">Stop the session. This one doesn't get trained through.</div>`;
    }
    h+=`</div>`;
  });
  $("app").innerHTML=h;
  $("mode").onclick=()=>{detail=!detail;session();};
  document.querySelectorAll("[data-tick]").forEach(el=>el.onclick=()=>{
    const e=sess.ex[+el.dataset.tick];e.logged=!e.logged;
    if(e.logged){if(navigator.vibrate)navigator.vibrate(12);rest(e.rest,e.n);}
    session();});
  document.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>{
    const e=sess.ex[+el.dataset.i],d=+el.dataset.v,a=el.dataset.a;
    if(a==="w")e.w=Math.max(0,e.w+d*e.st);
    if(a==="r")e.rep=Math.max(1,e.rep+d);
    if(a==="s")e.sets=Math.max(1,e.sets+d);
    session();});
  document.querySelectorAll("[data-f]").forEach(el=>{
    el.onfocus=()=>el.select();
    el.onchange=()=>{const e=sess.ex[+el.dataset.i],v=parseFloat(el.value),f=el.dataset.f;
      if(!isNaN(v)){
        if(f==="w")e.w=Math.max(0,v);
        if(f==="r")e.rep=Math.max(1,Math.round(v));
        if(f==="s")e.sets=Math.max(1,Math.round(v));}
      session();};});
  document.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{
    const [i,v]=el.dataset.k.split("-").map(Number);
    sess.ex[i].knee=(sess.ex[i].knee===v?null:v);session();});
}

function rest(sec,label){
  restTot=sec;restLeft=sec;$("rest").classList.add("up");paintRest(label);
  clearInterval(timer);
  timer=setInterval(()=>{restLeft--;
    if(restLeft<=0){clearInterval(timer);restLeft=0;if(navigator.vibrate)navigator.vibrate([80,60,80]);}
    paintRest(label);},1000);
}
function paintRest(label){
  const m=Math.floor(restLeft/60),s=restLeft%60;
  $("rest").innerHTML=`<div class="t num ${restLeft===0?'zero':''}">${restLeft===0?"GO":`${m}:${String(s).padStart(2,'0')}`}</div>
    <div class="meta">${restLeft===0?"Rest done":"Resting"} · ${esc(label)}</div>
    <button class="skip" id="sk">${restLeft===0?"Close":"Skip"}</button>`;
  $("sk").onclick=()=>{clearInterval(timer);$("rest").classList.remove("up");};
}

async function finish(){
  const d=store[who],logged=sess.ex.filter(e=>e.logged);
  let sets=0,beats=0;
  logged.forEach(e=>{
    sets+=e.sets;
    if(e.prev&&e.w*e.rep>e.prev.w*e.prev.rep)beats++;
    d.last[e.n]={date:Date.now(),w:e.w,rep:e.rep,sets:e.sets};});
  const flags=sess.ex.filter(e=>e.knee>=2).map(e=>e.n);
  if(logged.length){
    d.sessions.push({date:Date.now(),dayName:sess.dayName,sets,kneeFlags:flags});
    if(d.sessions.length>80)d.sessions=d.sessions.slice(-80);
    d.lastDay=sess.di;
  }
  clearInterval(timer);$("rest").classList.remove("up");
  done={ex:logged.length,sets,beats,mins:Math.max(1,Math.round((Date.now()-sess.start)/6e4)),flags};
  await save(who);view="done";render();window.scrollTo(0,0);
}

function summary(){
  const f=done;
  let h=`<div class="eyebrow">Saved</div><div class="card summary">
    <div class="big num">${f.ex}</div>
    <div style="color:var(--steel);font-size:.9rem;margin-top:4px">exercises · ${f.sets} sets · ${f.mins} min</div>`;
  if(f.beats)h+=`<div style="color:var(--good);font-size:.9rem;margin-top:10px">${f.beats} lift${f.beats>1?'s':''} up on last time</div>`;
  h+=`</div>`;
  if(f.flags.length)h+=`<div class="warnbox" style="margin-top:12px">Knee flagged on: ${f.flags.map(esc).join(", ")}. Leave those out until a PT looks at it.</div>`;
  h+=`<button class="primary" style="margin-top:14px" id="ch">Log cardio</button>
      <button class="ghostbtn" id="hm">Done</button>`;
  $("app").innerHTML=h;
  $("hm").onclick=()=>{view="home";render();};
  $("ch").onclick=()=>{view="home";render();openSheet("cardio");};
}


/* ---- backup / restore ---- */
function wireBackup(){
  const e=$("expBtn"),i=$("impBtn");
  if(!e||!i)return;
  e.onclick=async()=>{
    const blob=JSON.stringify({v:2,ben:store.ben,bria:store.bria});
    try{await navigator.clipboard.writeText(blob);toast("Copied — paste somewhere safe");}
    catch(err){window.prompt("Copy this text and keep it safe:",blob);}
  };
  i.onclick=async()=>{
    const txt=window.prompt("Paste a backup to restore. This replaces everything currently saved.");
    if(!txt)return;
    try{
      const d=JSON.parse(txt);
      if(!d.ben&&!d.bria)throw new Error("bad");
      if(d.ben)store.ben=d.ben;
      if(d.bria)store.bria=d.bria;
      await save("ben");await save("bria");render();toast("Restored");
    }catch(err){toast("That didn't look like a backup");}
  };
}

function render(){bar();view==="home"?home():view==="session"?session():summary();}
(async()=>{await load("ben");await load("bria");render();})();
</script>
</body>
